name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot rpm libarchive-tools

      - name: Build JAR
        run: mvn package -q -DskipTests

      - name: Build Debian package
        run: ./build-deb.sh

      - name: Build RPM package
        run: ./build-rpm.sh

      - name: Build pacman package
        run: ./build-pacman.sh

      - name: Prepare Flatpak sources
        run: |
          cp target/convertor-tool-1.0.0.jar flatpak-pkg/convertor-tool.jar

      - name: Install Flatpak dependencies
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.freedesktop.Sdk.Extension.openjdk21//24.08 2>&1

      - name: Build Flatpak package
        run: |
          flatpak-builder --repo=repo --force-clean --install-deps-from=flathub --user \
            build flatpak-pkg/com.convertor.ConvertorTool.yml 2>&1
          flatpak build-bundle repo convertor-tool-1.0.0-1.x86_64.flatpak \
            com.convertor.ConvertorTool 2>&1

      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          files: |
            convertor-tool_*.deb
            convertor-tool-*.rpm
            convertor-tool-*.pkg.tar.zst
            convertor-tool-*.flatpak
